name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new push lands; the
# older run's result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

# GitHub-hosted macOS ARM runner. Intel macs and Linux/Windows are
# intentionally unsupported.
jobs:
  rust:
    name: Rust + UI (macOS, Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node ^20.19 || >=22.12. Pinning "22" picks
          # the latest Node 22 LTS so we're never closer to the bound
          # than necessary.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      # `npm ci` enforces lockfile parity; a drift between
      # `package.json` and `package-lock.json` should fail loudly rather
      # than be silently papered over.
      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: UI typecheck
        working-directory: ui
        run: npx tsc -b --noEmit

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: cargo build
        run: cargo build --workspace

  audit:
    name: Supply chain audit
    runs-on: macos-14
    # Don't gate merges on transient advisory updates; surface them as
    # warnings on the PR while keeping the main `rust` job authoritative.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install --locked cargo-audit
          cargo install --locked cargo-deny

      - name: cargo audit
        run: cargo audit --deny warnings

      - name: cargo deny
        run: cargo deny check
