name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

# Runs on a self-hosted macOS runner registered on the maintainer's
# machine — GitHub-hosted minutes for macOS are billed at 10× the Linux
# rate, so we execute locally to keep costs at zero. Linux/Windows are
# intentionally unsupported: bring them back by adding a matrix and
# pointing at GitHub-hosted runners (or more self-hosted boxes).
jobs:
  rust:
    name: Rust (macOS, self-hosted)
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node ^20.19 || >=22.12. Pinning "22" picks
          # the latest Node 22 LTS so we're never closer to the bound
          # than necessary.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci || npm install

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test (no SSH feature)
        run: cargo test --workspace --no-fail-fast

      - name: cargo build
        run: cargo build --workspace
