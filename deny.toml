# cargo-deny configuration — run via `cargo deny check` in CI.
#
# Catches three classes of supply-chain regression: known security
# advisories, banned dependencies (OpenSSL — we keep the tree
# rustls-only on purpose), and license drift.

[graph]
all-features = false
no-default-features = false

[advisories]
# Fail on any unmaintained / yanked / vulnerable crate by default.
# `cargo audit` runs alongside this; both are wired in CI so a new
# advisory turns the workflow yellow without blocking merges.
yanked = "warn"
ignore = []

[licenses]
# Project ships dual MIT OR Apache-2.0. Permissive licenses are the
# allow-list; anything else needs a deliberate exception.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "OpenSSL",
]
confidence-threshold = 0.8

[bans]
# Multiple versions are unavoidable in a Tauri tree (Tauri pulls one
# minor of `thiserror`, our code pulls another, etc.). Warn so we
# notice rather than blocking.
multiple-versions = "warn"
wildcards = "deny"
# Explicit `openssl` ban: every networked crate in the workspace uses
# `ureq` (rustls) or `russh` (custom crypto). If openssl ever appears
# in `Cargo.lock`, something pulled it in and the audit should catch it
# before we ship a binary that links libssl.
deny = [
  { name = "openssl-sys" },
  { name = "openssl" },
  { name = "native-tls" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
