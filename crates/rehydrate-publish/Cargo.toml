[package]
name = "rehydrate-publish"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "reHydrate publish layer: post OCR transcripts as drafts to Ghost / WordPress."

[dependencies]
base64 = "0.22"
hex = { workspace = true }
# `default-features = false` strips PEM parsing (we only sign with a raw
# HMAC secret) and the OS-default crypto picker. v10 requires an explicit
# crypto-provider feature; `rust_crypto` matches our rustls-only,
# pure-Rust posture (see deny.toml: openssl/native-tls are banned).
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
# Host-pinned, redirect-refusing ureq agent + URL safety check.
# See `rehydrate-ocr/Cargo.toml` for the rationale.
rehydrate-http = { path = "../rehydrate-http" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tiny_http = "0.12"
