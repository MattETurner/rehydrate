[package]
name = "rehydrate-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "reHydrate desktop app: Tauri binary."

[lib]
name = "rehydrate_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "rehydrate-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rehydrate-core = { path = "../rehydrate-core" }
rehydrate-device = { path = "../rehydrate-device", features = ["ssh"] }
rehydrate-sync = { path = "../rehydrate-sync" }
rehydrate-ocr = { path = "../rehydrate-ocr" }
rehydrate-publish = { path = "../rehydrate-publish" }
# Pulled in to convert OCR transcript Markdown into HTML for
# Ghost/WordPress drafts in `ocr_commands::publish_transcript`.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

anyhow = { workspace = true }
directories = { workspace = true }
keyring = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
printpdf = { workspace = true }
image = { workspace = true }
rm-parser = { path = "../rm-parser" }
base64 = "0.22"
tempfile = { workspace = true }
# Used only to validate user-supplied Ollama / publishing URLs in
# `ocr_commands::validate_ollama_url`. `rehydrate-ocr` already
# transitively pulls this in via `url`, so the build cost is zero.
url = "2"

[features]
# `devtools` enables the Tauri webview inspector (F12 / Cmd+Opt+I).
# It is default-on so daily `cargo run` / `cargo tauri dev` works
# without flags, but the release workflow MUST build with
# `--no-default-features` so shipped binaries don't expose the
# inspector to end users — the renderer can call any registered
# Tauri command, so an open DevTools is a security boundary skip.
default = ["devtools"]
devtools = ["tauri/devtools"]
