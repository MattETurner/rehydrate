[package]
name = "rehydrate-device"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "reHydrate device transport: trait + USB-ethernet SSH/SFTP impl + local-directory fake."

[dependencies]
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }

[features]
default = ["ssh"]
ssh = ["dep:russh", "dep:russh-sftp", "dep:keyring", "dep:secrecy"]
# Expose `FakeDevice` outside of `cfg(test)` builds. Off by default
# because the only production consumer is the SSH path; downstream
# test crates that want the fake (currently `rehydrate-sync`) enable
# this feature via a `dev-dependencies` entry rather than pulling it
# into the shipped binary.
fake = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
